<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Proposal 💖</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  text-align: center;
}

/* Background video */
video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -1;
}

/* Main text */
h1 {
  position: relative;
  z-index: 2;
  color: white;
  margin-top: 120px;
  font-size: 40px;
}

/* Buttons */
button {
  position: relative;
  z-index: 2;
  padding: 15px 25px;
  margin: 20px;
  font-size: 18px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
}

/* YES button */
#yes {
  background-color: pink;
}

/* NO button */
#no {
  background-color: lightgray;
  position: absolute;
}
</style>
</head>

<body>

<!-- VIDEO -->
<video autoplay muted loop>
  <source src="PASTE_YOUR_VIDEO_LINK_HERE" type="video/mp4">
</video>

<!-- TEXT -->
<h1>Will you be mine? 💖</h1>

<!-- BUTTONS -->
<button id="yes" onclick="yesClicked()">YES 💖</button>
<button id="no" onmouseover="moveNo()">NO 😜</button>

<script>
function yesClicked() {
  alert("Yayyyyy 💖 I love you 😍");
}

function moveNo() {
  let x = Math.random() * (window.innerWidth - 100);
  let y = Math.random() * (window.innerHeight - 50);
  document.getElementById("no").style.left = x + "px";
  document.getElementById("no").style.top = y + "px";
}
</script>

</body>
</html>
