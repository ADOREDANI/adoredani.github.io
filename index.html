<!DOCTYPE html>
<html>
<head>
<title>For You ❤️</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  text-align: center;
  color: white;
  overflow: hidden;
}

video {
  position: fixed;
  right: 0;
  bottom: 0;
  min-width: 100%;
  min-height: 100%;
  z-index: -1;
}

h1 {
  margin-top: 100px;
  font-size: 40px;
  animation: fade 2s infinite alternate;
}

@keyframes fade {
  from {opacity: 0.5;}
  to {opacity: 1;}
}

button {
  padding: 15px 30px;
  font-size: 20px;
  margin: 20px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
}

#yes {
  background: pink;
  color: black;
  box-shadow: 0 0 20px pink;
}

#no {
  background: red;
  position: absolute;
}
</style>

</head>

<body>

<video autoplay muted loop>
  <source src="PASTE_VIDEO_LINK_HERE" type="video/mp4">
</video>

<h1>Will you be mine? ❤️</h1>

<button id="yes" onclick="yesClicked()">YES 💖</button>
<button id="no" onmouseover="moveNo()">NO 😜</button>

<script>
function yesClicked() {
  alert("Yayyyyy ❤️ I love you 😍");
}

function moveNo() {
  let x = Math.random() * window.innerWidth;
  let y = Math.random() * window.innerHeight;
  document.getElementById("no").style.left = x + "px";
  document.getElementById("no").style.top = y + "px";
}
</script>

</body>
</html>
