<!DOCTYPE html>
<html>
<head>
<title>For You ❤️</title>
<style>
body {
  text-align: center;
  font-family: Arial;
  background: black;
  color: white;
}
video {
  width: 80%;
  margin-top: 20px;
}
button {
  padding: 12px 25px;
  margin: 20px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}
#yes { background: green; color: white; }
#no { background: red; position: absolute; }
</style>
</head>

<body>

<h2>This is for you ❤️</h2>

<video controls>
  <source src="PASTE_VIDEO_LINK_HERE" type="video/mp4">
</video>

<h3>Will you be mine?</h3>

<button id="yes" onclick="yesClick()">Yes 💖</button>
<button id="no" onmouseover="moveNo()">No 😅</button>

<script>
function yesClick() {
  alert("You just made me the happiest person ❤️");
}

function moveNo() {
  let x = Math.random() * window.innerWidth;
  let y = Math.random() * window.innerHeight;
  document.getElementById("no").style.left = x + "px";
  document.getElementById("no").style.top = y + "px";
}
</script>

</body>
</html>
