<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Proposal 💖</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: pink;
  font-family: Arial, sans-serif;
  text-align: center;
}

/* Center everything */
.container {
  margin-top: 150px;
}

/* Text */
h1 {
  color: white;
  font-size: 40px;
}

/* Buttons */
button {
  padding: 15px 25px;
  margin: 20px;
  font-size: 18px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
}

/* YES button */
#yes {
  background-color: red;
  color: white;
}

/* NO button */
#no {
  background-color: white;
  position: absolute;
}
</style>
</head>

<body>

<div class="container">
  <h1>Will you be mine? 💖</h1>

  <button id="yes" onclick="yesClicked()">YES 💖</button>
  <button id="no" onmouseover="moveNo()">NO 😜</button>
</div>

<script>
function yesClicked() {
  alert("Yayyyyy 💖 I love you 😍");
}

function moveNo() {
  let x = Math.random() * (window.innerWidth - 100);
  let y = Math.random() * (window.innerHeight - 50);
  document.getElementById("no").style.left = x + "px";
  document.getElementById("no").style.top = y + "px";
}
</script>

</body>
</html>
